program: ../main.py
method: bayes
metric:
  name: Custom_metric
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 5
parameters:
  epochs:
    min: 1
    max: 5
  batch_size:
    min: 500
    max: 2000
  lr:
    min: 0.0001
    max: 0.1
  optimizer:
    values: ["adam", "sgd"]
  

command:
  - ${env}
  - poetry 
  - run 
  - python
  - ${program}
  - ${args}
  - --dataset
  - income
  - --num_rounds
  - 10
  - --num_client_cpus
  - 1
  - --num_client_gpus
  - 0.1
  - --pool_size
  - 51
  - --sampled_clients 
  - 0.3
  - --sampled_clients_test 
  - 0.5
  - --sampled_clients_validation 
  - 0.5
  - --debug
  - False
  - --base_path
  - ../../dataset/income/
  - --dataset_path 
  - ../../dataset/income/
  - --seed 
  - 41 
  - --wandb 
  - True 
  - --sweep
  - True
  - --training_nodes 
  - 0.61
  - --validation_nodes 
  - 0.20
  - --test_nodes 
  - 0.20
  - --noise_multiplier
  - 0
  - --tabular_data 
  - True
  - --one_group_nodes
  - True
  - --update_lambda
  - False
  - --metric
  - equalised_odds