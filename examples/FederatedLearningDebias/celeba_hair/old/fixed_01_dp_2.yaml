program: ../main.py
method: bayes
metric:
  name: Custom_metric
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 3
parameters:
  epochs:
    min: 1
    max: 5
  batch_size:
    min: 300
    max: 800
  lr:
    min: 0.0001
    max: 0.1
  optimizer:
    values: ["adam", "sgd"]
  
  clipping:
    min: 1.0
    max: 20.0
  regularization_lambda:
    min: 0.05
    max: 0.9

command:
  - ${env}
  - poetry 
  - run 
  - python
  - ${program}
  - ${args}
  - --dataset
  - celeba_hair
  - --num_rounds
  - 39
  - --num_client_cpus
  - 1
  - --num_client_gpus
  - 0.05
  - --pool_size
  - 150
  - --sampled_clients 
  - 0.34
  - --sampled_clients_test 
  - 0.5
  - --sampled_clients_validation 
  - 0.5
  - --train_csv
  - celeba_hair_merged
  - --debug
  - False
  - --base_path
  - ../../../../data
  - --dataset_path 
  - ../../../../data/celeba_hair/
  - --seed 
  - 41 
  - --wandb 
  - True 
  - --sweep
  - True
  - --training_nodes 
  - 0.40
  - --validation_nodes 
  - 0.27
  - --test_nodes 
  - 0.335
  - --partition_type 
  - representative 
  - --group_to_reduce 
  - 1 
  - 0
  - --group_to_increment 
  - 0 
  - 0
  - --number_of_samples_per_node 
  - 805
  - --ratio_unfair_nodes 
  - 0.5 
  - --ratio_unfairness 
  - 0.2
  - 0.4
  - --metric
  - equalised_odds
  - --epsilon
  - 4.0
  - --epsilon_statistics
  - 1.0
  - --splitted_data_dir
  - federated
  - --update_lambda
  - False
  - --regularization_mode
  - fixed
