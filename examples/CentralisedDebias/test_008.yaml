program: test_equalised_odds.py
method: bayes
metric:
  name: Custom_metric
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 3
parameters:
  batch_size:
    min: 32
    max: 256
  lr:
    min: 0.0001
    max: 0.1
  optimizer:
    values: ["adam", "sgd"]
  regularization_lambda:
    min: 0.05
    max: 0.95

command:
  - ${env}
  - poetry 
  - run 
  - python
  - ${program}
  - ${args}
  - --target
  - 0.08