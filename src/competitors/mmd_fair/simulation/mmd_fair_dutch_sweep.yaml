program: src/competitors/mmd_fair/simulation/main.py
method: bayes
metric:
  name: test_fairness
  goal: minimize
early_terminate:
  type: hyperband
  min_iter: 3
parameters:
  batch_size:
    values: [32, 64]
  lr:
    min: 0.001
    max: 0.1
  optimizer:
    values: ["sgd"]
  lambda_fairness:
    min: 0.1
    max: 5.0
  mu:
    min: 0.1
    max: 1.0
  ny:
    values: [50, 100]
  momentum:
    min: 0.5
    max: 0.9

command:
  - ${env}
  - uv
  - run
  - python
  - ${program}
  - ${args}
  - --dataset_name
  - dutch
  - --num_client_cpus
  - 1
  - --num_client_gpus
  - 0
  - --num_rounds
  - 20
  - --num_clients
  - 10
  - --target_attribute
  - occupation
  - --sensitive_attribute
  - sex
  - --fed_dir
  - ./training_data_mmd/
  - --project_name
  - MMDFairValidation
  - --wandb
  - True
  - --partitioner_type
  - iid
