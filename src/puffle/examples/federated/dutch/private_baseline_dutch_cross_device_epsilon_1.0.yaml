program: ../../../../FlowerFLTemplate/main.py
method: bayes
metric:
  name: custom_metric
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 3
parameters:
  batch_size:
    min: 64
    max: 256
  lr:
    min: 0.0001
    max: 0.1
  optimizer:
    values: ["adam", "sgd"]
  num_epochs:
    min: 1
    max: 3
  max_grad_norm:
    distribution: uniform
    max: 20
    min: 1 
    
command:
  - ${env}
  - uv 
  - run 
  - python
  - ${program}
  - ${args}
  - --dataset_name
  - dutch
  - --num_client_cpus
  - 1
  - --num_client_gpus
  - 0
  - --num_rounds
  - 10
  - --num_clients 
  - 150
  - --FL_setting 
  - cross_device 
  - --sampled_train_nodes_per_round
  - 0.3
  - --sampled_validation_nodes_per_round
  - 1.0
  - --sampled_test_nodes_per_round
  - 0.0
  - --fed_dir 
  - ./training_data_2/ 
  - --project_name 
  - TestTemplateFL 
  - --run_name 
  - Test 
  - --wandb 
  - True 
  - --dataset_path 
  - ../../data/dutch_csv/dutch.csv 
  - --partitioner_type 
  - fairness
  - --sweep
  - True
  - --fairness_metric
  - disparity
  - --num_train_nodes 
  - 70
  - --num_validation_nodes
  - 30
  - --num_test_nodes 
  - 50
  - --ratio_unfair_clients
  - 0.5
  - --group_to_reduce
  - 0
  - 1
  - --group_to_increment
  - 1 
  - 1
  - --ratio_unfairness
  - 0.3
  - 0.4
  - --target_attribute
  - occupation
  - --sensitive_attribute
  - sex
  - --epsilon
  - 1.0
  - --distribution_mode
  - per_group