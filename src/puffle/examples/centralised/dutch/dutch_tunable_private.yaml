program: main.py
method: bayes
metric:
  name: Custom_metric
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 3
parameters:
  batch_size:
    min: 512
    max: 2028
  lr:
    min: 0.0001
    max: 0.1
  optimizer:
    values: ["adam", "sgd"]
  momentum:
    min: 0.0
    max: 0.9
  weight_decay_alpha:
    min: 0.001
    max: 1.0
  alpha:
    min: 0.1
    max: 4.0
  max_grad_norm:
    distribution: uniform
    max: 20
    min: 1  

command:
  - ${env}
  - uv 
  - run 
  - python
  - ${program}
  - ${args}
  - --project_name 
  - PuffleRewrite
  - --target
  - 0.05
  - --epochs
  - 10
  - --sweep
  - True 
  - --regularization_mode
  - tunable
  - --csv_path
  - ../../data/dutch/
  - --epsilon
  - 0.7
  - --epsilon_lambda
  - 0.3