program: ../main.py
method: bayes
metric:
  name: Custom_metric
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 5
parameters:
  epochs:
    min: 1
    max: 5
  batch_size:
    min: 500
    max: 2000
  lr:
    min: 0.0001
    max: 0.1
  optimizer:
    values: ["adam", "sgd"]
  alpha_target_lambda:
    min: 0.1
    max: 4.0
  momentum:
    min: 0.0
    max: 0.9
  
  weight_decay_lambda:
    min: 0.001
    max: 1.0
  clipping:
    min: 1.0
    max: 20.0
    
command:
  - ${env}
  - poetry 
  - run 
  - python
  - ${program}
  - ${args}
  - --dataset
  - income
  - --num_rounds
  - 10
  - --num_client_cpus
  - 1
  - --num_client_gpus
  - 0.1
  - --pool_size
  - 51
  - --sampled_clients 
  - 0.3
  - --sampled_clients_test 
  - 0.5
  - --sampled_clients_validation 
  - 0.5
  - --debug
  - False
  - --base_path
  - ../../dataset/income/
  - --dataset_path 
  - ../../dataset/income/
  - --regularization 
  - True 
  - --regularization_mode
  - tunable
  - --seed 
  - 41 
  - --wandb 
  - True 
  - --sweep
  - True
  - --training_nodes 
  - 0.61
  - --validation_nodes 
  - 0.20
  - --test_nodes 
  - 0.20
  - --target 
  - 0.15
  - --epsilon
  - 0.75
  - --epsilon_statistics
  - 0.25
  - --tabular_data 
  - True
  - --update_lambda
  - True
  - --metric
  - equalised_odds
