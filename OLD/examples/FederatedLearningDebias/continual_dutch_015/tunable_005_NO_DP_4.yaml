program: ../main.py
method: bayes
metric:
  name: Custom_metric
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 5
parameters:
  epochs:
    min: 2
    max: 7
  batch_size:
    min: 32
    max: 128
  lr:
    min: 0.0001
    max: 0.1
  optimizer:
    values: ["adam", "sgd"]
  alpha_target_lambda:
    min: 0.1
    max: 4.0
  momentum:
    min: 0.0
    max: 0.9
  weight_decay_lambda:
    min: 0.001
    max: 1.0

command:
  - ${env}
  - poetry 
  - run 
  - python
  - ${program}
  - ${args}
  - --dataset
  - continual_dutch
  - --num_rounds
  - 20
  - --num_client_cpus
  - 1
  - --num_client_gpus
  - 0.05
  - --pool_size
  - 150
  - --sampled_clients 
  - 0.3
  - --sampled_clients_test 
  - 0
  - --sampled_clients_validation 
  - 1.0
  - --debug
  - False
  - --base_path
  - ../../../../data/continual_dutch_015/
  - --dataset_path 
  - ../../../../data/continual_dutch_015/
  - --seed 
  - 42
  - --wandb 
  - True
  - --sweep
  - True
  - --training_nodes 
  - 0.40
  - --validation_nodes 
  - 0.27
  - --test_nodes 
  - 0.335
  - --tabular_data 
  - True
  - --metric
  - disparity
  - --splitted_data_dir
  - federated_4
  - --switch_dataset
  - 21
  - --ratio_unfair_nodes
  - 0.5
  - --regularization_mode
  - tunable
  - --regularization
  - True
  - --target 
  - 0.05
