program: ../main.py
method: bayes
metric:
  name: Custom_metric
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 5
parameters:
  epochs:
    min: 1
    max: 5
  batch_size:
    min: 300
    max: 800
  lr:
    min: 0.0001
    max: 0.1
  optimizer:
    values: ["adam", "sgd"]
  
  clipping:
    min: 1.0
    max: 20.0
  alpha_target_lambda:
    min: 0.1
    max: 4.0
  momentum:
    min: 0.0
    max: 0.9
  weight_decay_lambda:
    min: 0.001
    max: 1.0

