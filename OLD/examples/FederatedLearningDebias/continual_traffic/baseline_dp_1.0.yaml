program: ../main.py
method: bayes
metric:
  name: Custom_metric
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 5
parameters:
  epochs:
    min: 1
    max: 5
  batch_size:
    min: 1000
    max: 5000
  lr:
    min: 0.0001
    max: 0.1
  optimizer:
    values: ["adam", "sgd"]
  clipping:
    min: 1.0
    max: 20.0

command:
  - ${env}
  - poetry 
  - run 
  - python
  - ${program}
  - ${args}
  - --dataset
  - continual_traffic
  - --num_rounds
  - 10
  - --num_client_cpus
  - 1
  - --num_client_gpus
  - 0.05
  - --pool_size
  - 150
  - --sampled_clients 
  - 0.3
  - --sampled_clients_test 
  - 0
  - --sampled_clients_validation 
  - 1.0
  - --debug
  - False
  - --base_path
  - ../../../../data/continual_traffic/
  - --dataset_path 
  - ../../../../data/continual_traffic/
  - --seed 
  - 42
  - --wandb 
  - True
  - --sweep
  - True
  - --training_nodes 
  - 0.40
  - --validation_nodes 
  - 0.27
  - --test_nodes 
  - 0.335
  - --tabular_data 
  - True
  - --metric
  - disparity
  - --splitted_data_dir
  - federated
  - --switch_dataset
  - 11
  - --ratio_unfair_nodes
  - 0.5
  - --epsilon
  - 2.0