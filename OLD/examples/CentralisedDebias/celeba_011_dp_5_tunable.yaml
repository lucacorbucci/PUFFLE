program: test_celeba.py
method: bayes
metric:
  name: Custom_metric
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 3
parameters:
  batch_size:
    min: 512
    max: 2028
  lr:
    min: 0.0001
    max: 0.1
  optimizer:
    values: ["adam", "sgd"]
  clipping_value:
    min: 1.0    
    max: 20.0
  regularization_mode:
    value: "tunable"
  sweep:
    value: True
  epochs:
    value: 10
  epsilon:
    value: 5
  target: 
    value: 0.11
  momentum:
    min: 0.0
    max: 0.9
  weight_decay_lambda:
    min: 0.001
    max: 1.0
  alpha_target_lambda:
    min: 0.1
    max: 4.0
    
command:
  - ${env}
  - poetry 
  - run 
  - python
  - ${program}
  - ${args}