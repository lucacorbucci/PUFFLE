program: test_celeba.py
method: bayes
metric:
  name: Custom_metric
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 3
parameters:
  batch_size:
    min: 512
    max: 2028
  lr:
    min: 0.0001
    max: 0.1
  optimizer:
    values: ["adam", "sgd"]
  regularization_lambda:
    min: 0.05
    max: 0.9
  regularization_mode:
    value: "fixed"
  sweep:
    value: True
  epochs:
    value: 10
  target: 
    value: 0.07
    
command:
  - ${env}
  - poetry 
  - run 
  - python
  - ${program}
  - ${args}