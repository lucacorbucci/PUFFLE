program: test_equalised_odds.py
method: bayes
metric:
  name: Custom_metric
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 3
parameters:
  batch_size:
    min: 512
    max: 2048
  lr:
    min: 0.0001
    max: 0.1
  optimizer:
    values: ["adam", "sgd"]
  regularization_lambda:
    min: 0.05
    max: 0.95
  weight_decay_lambda:
    min: 0.001
    max: 1.0
  alpha_target_lambda:
    min: 0.1
    max: 4.0
  momentum:
    min: 0.0
    max: 0.9

command:
  - ${env}
  - poetry 
  - run 
  - python
  - ${program}
  - ${args}
  - --target
  - 0.08